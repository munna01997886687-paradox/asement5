<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Issues Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-auc-400">
    <div class="navbar bg-white shadow px-6">
      <div class="flex-1 font-bold text-lg">GitHub Issues Tracker</div>

      <div class="flex gap-3">
        <input
          id="searchInput"
          type="text"
          placeholder="Search issues..."
          class="input input-bordered"
        />

        <button onclick="searchIssue()" class="btn btn-primary">Search</button>
      </div>
    </div>

    <div class="p-8">
      <div class="mb-5">
        <h2 id="issueCount" class="font-bold text-xl"></h2>
        <p class="text-gray-500">Track and manage your project issues</p>
      </div>

      <div id="issuesContainer" class="grid grid-cols-4 gap-6"></div>
    </div>

    <dialog id="issueModal" class="modal">
      <div class="modal-box">
        <h3 id="modalTitle" class="font-bold text-lg"></h3>

        <p id="modalDescription" class="py-4"></p>

        <div class="flex justify-between">
          <p><b>Assignee:</b> <span id="modalAssignee"></span></p>

          <p><b>Priority:</b> <span id="modalPriority"></span></p>
        </div>

        <div class="modal-action">
          <button onclick="closeModal()" class="btn btn-primary">Close</button>
        </div>
      </div>
    </dialog>

    <script src="./home.js"></script>
  </body>
</html>
