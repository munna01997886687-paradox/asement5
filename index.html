<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GitHub Issues Tracker</title>

    <!-- Tailwind + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.10.1/dist/full.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-gray-200 flex items-center justify-center h-screen">
    <div class="card w-96 bg-base-100 shadow-xl p-6">
      <div class="flex flex-col items-center">
        <img
          src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
          class="w-14 mb-3"
        />

        <h2 class="text-xl font-semibold">GitHub Issues Tracker</h2>
        <p class="text-sm text-gray-500 mb-5">Sign in to manage your issues</p>
      </div>

      <form id="loginForm">
        <label class="label">Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          class="input input-bordered w-full"
        />

        <p class="text-xs text-purple-500 mb-2">Default: admin</p>

        <label class="label">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          class="input input-bordered w-full"
        />

        <p class="text-xs text-purple-500 mb-4">Default: admin123</p>

        <button class="btn btn-primary w-full">Sign In</button>
      </form>

      <div class="divider">OR</div>

      <div class="bg-gray-100 p-3 rounded text-center text-sm">
        <p>Demo Credentials:</p>
        <p><b>Username:</b> admin</p>
        <p><b>Password:</b> admin123</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
